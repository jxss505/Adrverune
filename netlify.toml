# ==============================================================================
# Netlify Configuration for ADVERUNE Web Application
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# ------------------------------------------------------------------------------
# Security Headers & Caching Policies
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Static Assets Long-Term Caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ------------------------------------------------------------------------------
# API Route Rewrites to Netlify Serverless Functions
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/api/enquiry"
  to = "/.netlify/functions/enquiry"
  status = 200
  force = true

[[redirects]]
  from = "/api/enquiry/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# ------------------------------------------------------------------------------
# SPA Fallback: Direct all page routes to index.html for React Router
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
